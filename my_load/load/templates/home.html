<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <link rel="stylesheet" href="{% static 'load/style.css' %}">
    <meta charset="UTF-8">
    <title>Title</title>

</head>
<body>

<!__Кнопка перехода на страницу ввода формы__>

<h1>Django Image Uploading</h1>
<div class="btn">
    <h2>Добавить картинку самостоятельно</h2>
    <a href="post">На страницу POST</a>

    <a href="station">На замерные станции</a>
</div>

<ul>
  {% for post in object_list %}
    <h2>{{ post.title }}</h2>
    <img src="{{ post.cover.url}}" alt="{{ post.title }}">
  {% endfor %}
</ul>


</body>
</html>
